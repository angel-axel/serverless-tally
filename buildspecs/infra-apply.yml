version: 0.2

env:
  variables:
    TF_VERSION: "1.17.0"
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"

phases:
  install:
    commands:
      - curl -sSLo terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
      - unzip -o terraform.zip -d /usr/local/bin
      - terraform version

  pre_build:
    commands:
      - terraform init
      - cp "${CODEBUILD_SRC_DIR_PlanArtifact}/tfplan" ./tfplan
      - mkdir -p dist/lambdas
      - cp -r "${CODEBUILD_SRC_DIR_PlanArtifact}/dist/lambdas/." ./dist/lambdas/

  build:
    commands:
      - terraform apply tfplan